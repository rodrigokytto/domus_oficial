<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gama Patrimonial · Domus | Inteligência Imobiliária & Soluções Financeiras</title>
    <meta
      name="description"
      content="Plataforma oficial da Gama Patrimonial e Domus Consórcios. Imóveis de alto padrão, fazendas no Mato Grosso, simulações de financiamento SAC/PRICE, vistorias eletrônicas e consórcios homologados pelo BACEN em Tangará da Serra - MT. CRECI J-14280."
    />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/marcas/gama/favicon.svg" />
    <link rel="apple-touch-icon" href="/marcas/gama/apple-touch-icon.png" />
    <link rel="manifest" href="/marcas/gama/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --gama-preto: #121212;
        --gama-grafite: #2b2b2b;
        --gama-dourado: #c6a15b;
        --gama-dourado-hover: #d4b36a;
        --gama-dourado-dark: #a5823d;
        --gama-fundo: #f7f3ea;
        --gama-borda: #e5dfc9;
        --gama-branco: #ffffff;
        --gama-cinza-texto: #64748b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--gama-preto);
        background-color: #f8fafc;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
      }
      @media print {
        @page {
          size: A4 portrait;
          margin: 0;
        }
        html, body {
          background: #ffffff !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 210mm !important;
          height: 297mm !important;
          overflow: hidden !important;
        }
        header, footer, nav, button, .no-print {
          display: none !important;
        }
        #root > div > *:not(.modal-paper-overlay) {
          display: none !important;
        }
        .modal-paper-overlay {
          position: fixed !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          background: #ffffff !important;
          padding: 0 !important;
          margin: 0 !important;
          overflow: hidden !important;
          backdrop-filter: none !important;
          z-index: 999999 !important;
        }
        #folha-paper-pdf-a4 {
          box-shadow: none !important;
          border: none !important;
          margin: 0 auto !important;
          padding: 8mm 12mm !important;
          width: 210mm !important;
          max-width: 210mm !important;
          max-height: 297mm !important;
          box-sizing: border-box !important;
          page-break-after: avoid !important;
          page-break-inside: avoid !important;
          break-after: avoid !important;
          break-inside: avoid !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
